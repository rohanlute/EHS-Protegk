<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
  <div style="max-width: 640px; margin: 0 auto; padding: 24px;">
    <h2 style="margin: 0 0 16px;">{{ title|default:"Notification" }}</h2>
    <p>Hello {% if recipient %}{{ recipient.get_full_name|default:recipient.username }}{% else %}there{% endif %},</p>
    <p style="white-space: pre-line;">{{ message }}</p>
    {% if detail_url %}
      <p><a href="{{ detail_url }}">Open the related record</a></p>
    {% endif %}
    <p style="margin-top: 24px;">Regards,<br>EHS Management System</p>
  </div>
</body>
</html>
