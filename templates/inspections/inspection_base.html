<!-- templates/inspections/inspection_base.html -->

{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<style>
  /* ===== INSPECTION BASE - Premium Teal Theme ===== */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --primary-teal: #0d9488;
    --primary-teal-dark: #0f766e;
    --primary-teal-light: rgba(13, 148, 136, 0.08);
    --primary-teal-hover: rgba(13, 148, 136, 0.12);
    --primary-teal-medium: rgba(13, 148, 136, 0.15);
    
    --secondary-red: #dc2626;
    --secondary-red-light: rgba(220, 38, 38, 0.08);
    --secondary-gold: #d97706;
    --secondary-gold-light: rgba(217, 119, 6, 0.08);
    --secondary-green: #22c55e;
    --secondary-green-light: rgba(34, 197, 94, 0.08);
    --secondary-blue: #3b82f6;
    
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;
    --text-white: #ffffff;
    
    --border-color: #e2e8f0;
    --bg-card: #ffffff;
    --bg-page: #f1f5f9;
    --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-hover: 0 4px 20px rgba(13, 148, 136, 0.12);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.10);
    --radius-card: 14px;
    --radius-sm: 8px;
  }

  /* ========================================================== */
  /* INSPECTION CARDS                                            */
  /* ========================================================== */
  .inspection-card {
    background: var(--bg-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border-color);
    margin-bottom: 20px;
    border-top: 3px solid var(--primary-teal);
    transition: all 0.3s ease;
    overflow: hidden;
  }

  .inspection-card:hover {
    box-shadow: var(--shadow-hover);
  }

  .inspection-card .card-header {
    background: var(--primary-teal-light);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 20px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .inspection-card .card-header .card-title {
    color: var(--text-primary);
    font-weight: 700;
  }

  .inspection-card .card-body {
    padding: 20px 22px;
  }

  .inspection-card .card-footer {
    background: var(--primary-teal-light);
    border-top: 1px solid var(--border-color);
    padding: 14px 20px;
  }

  /* ========================================================== */
  /* QUESTION CARDS                                              */
  /* ========================================================== */
  .question-card {
    border-left: 3px solid var(--primary-teal);
    margin-bottom: 15px;
    transition: all 0.3s ease;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    border-left-width: 4px;
    padding: 14px 16px;
  }

  .question-card:hover {
    transform: translateX(5px);
    box-shadow: var(--shadow-hover);
    border-color: var(--primary-teal);
  }

  .question-card.critical {
    border-left-color: var(--secondary-red);
    background: var(--secondary-red-light);
  }

  .question-card .question-text {
    font-weight: 500;
    color: var(--text-primary);
    font-size: 14px;
  }

  .question-card .question-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ========================================================== */
  /* TABLE STYLES                                                */
  /* ========================================================== */
  .table-actions {
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .btn-action-sm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    background: white;
    color: var(--text-muted);
    transition: all 0.2s ease;
    text-decoration: none;
    font-size: 12px;
  }

  .btn-action-sm:hover {
    text-decoration: none;
  }

  .btn-action-sm.view:hover {
    background: var(--primary-teal-light);
    border-color: var(--primary-teal);
    color: var(--primary-teal);
  }

  .btn-action-sm.edit:hover {
    background: var(--secondary-gold-light);
    border-color: var(--secondary-gold);
    color: var(--secondary-gold);
  }

  .btn-action-sm.delete:hover {
    background: var(--secondary-red-light);
    border-color: var(--secondary-red);
    color: var(--secondary-red);
  }

  /* ========================================================== */
  /* FILTER SECTION                                              */
  /* ========================================================== */
  .filter-section {
    background: var(--primary-teal-light);
    padding: 18px 20px;
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    border: 1px solid var(--border-color);
  }

  .filter-section .form-label {
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .filter-section .form-control,
  .filter-section .form-select {
    border-radius: var(--radius-sm);
    border: 2px solid var(--border-color);
    padding: 8px 12px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
    background: white;
    color: var(--text-primary);
  }

  .filter-section .form-control:focus,
  .filter-section .form-select:focus {
    outline: none;
    border-color: var(--primary-teal);
    box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.08);
  }

  .btn-filter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--primary-teal);
    color: white;
    font-weight: 600;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .btn-filter:hover {
    background: var(--primary-teal-dark);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
  }

  .btn-reset {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    background: white;
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
    cursor: pointer;
    text-decoration: none;
  }

  .btn-reset:hover {
    background: var(--primary-teal-light);
    border-color: var(--primary-teal);
    color: var(--primary-teal);
    text-decoration: none;
  }

  /* ========================================================== */
  /* BADGES                                                      */
  /* ========================================================== */
  .badge-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 20px;
  }

  .badge-status.badge-scheduled {
    background: #dbeafe;
    color: #2563eb;
  }

  .badge-status.badge-in-progress {
    background: #fef3c7;
    color: #d97706;
  }

  .badge-status.badge-completed {
    background: #dcfce7;
    color: #16a34a;
  }

  .badge-status.badge-overdue {
    background: #fee2e2;
    color: #dc2626;
  }

  .badge-status.badge-draft {
    background: #f1f5f9;
    color: #64748b;
  }

  .badge-status.badge-submitted {
    background: var(--primary-teal-light);
    color: var(--primary-teal);
  }

  .badge-status.badge-approved {
    background: #dcfce7;
    color: #16a34a;
  }

  .badge-status.badge-rejected {
    background: #fee2e2;
    color: #dc2626;
  }

  /* ========================================================== */
  /* CATEGORY BADGE                                              */
  /* ========================================================== */
  .category-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: var(--primary-teal);
    color: white;
  }

  .category-badge-sm {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    background: var(--primary-teal-light);
    color: var(--primary-teal);
    border: 1px solid rgba(13, 148, 136, 0.1);
  }

  /* ========================================================== */
  /* TEMPLATE PREVIEW                                            */
  /* ========================================================== */
  .template-preview {
    border: 1px solid var(--border-color);
    padding: 16px 20px;
    border-radius: var(--radius-sm);
    background: #fafbfc;
    transition: all 0.3s ease;
  }

  .template-preview:hover {
    border-color: var(--primary-teal);
  }

  .template-preview .preview-title {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 14px;
  }

  .template-preview .preview-meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ========================================================== */
  /* BUTTONS                                                     */
  /* ========================================================== */
  .btn-teal {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
    cursor: pointer;
    text-decoration: none;
    border: none;
  }

  .btn-teal:hover {
    transform: translateY(-2px);
    text-decoration: none;
  }

  .btn-teal.primary {
    background: var(--primary-teal);
    color: white;
  }
  .btn-teal.primary:hover {
    background: var(--primary-teal-dark);
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
  }

  .btn-teal.success {
    background: var(--secondary-green);
    color: white;
  }
  .btn-teal.success:hover {
    background: #16a34a;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
  }

  .btn-teal.warning {
    background: var(--secondary-gold);
    color: white;
  }
  .btn-teal.warning:hover {
    background: #b45309;
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
  }

  .btn-teal.danger {
    background: var(--secondary-red);
    color: white;
  }
  .btn-teal.danger:hover {
    background: #b91c1c;
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
  }

  .btn-teal.info {
    background: var(--secondary-blue);
    color: white;
  }
  .btn-teal.info:hover {
    background: #2563eb;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  .btn-teal.outline-primary {
    background: transparent;
    color: var(--primary-teal);
    border: 2px solid var(--primary-teal);
  }
  .btn-teal.outline-primary:hover {
    background: var(--primary-teal);
    color: white;
  }

  .btn-teal.outline-success {
    background: transparent;
    color: var(--secondary-green);
    border: 2px solid var(--secondary-green);
  }
  .btn-teal.outline-success:hover {
    background: var(--secondary-green);
    color: white;
  }

  .btn-teal.outline-danger {
    background: transparent;
    color: var(--secondary-red);
    border: 2px solid var(--secondary-red);
  }
  .btn-teal.outline-danger:hover {
    background: var(--secondary-red);
    color: white;
  }

  .btn-teal.small {
    padding: 4px 12px;
    font-size: 12px;
  }

  /* ========================================================== */
  /* PAGINATION                                                  */
  /* ========================================================== */
  .pagination-teal .page-link {
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
  }

  .pagination-teal .page-link:hover {
    background: var(--primary-teal-light);
    border-color: var(--primary-teal);
    color: var(--primary-teal);
  }

  .pagination-teal .page-item.active .page-link {
    background: var(--primary-teal);
    border-color: var(--primary-teal);
    color: white;
  }

  /* ========================================================== */
  /* EMPTY STATE                                                 */
  /* ========================================================== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
  }

  .empty-state .empty-icon {
    font-size: 56px;
    color: var(--primary-teal-light);
    margin-bottom: 16px;
  }

  .empty-state h4 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .empty-state p {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 400;
  }

  /* ========================================================== */
  /* RESPONSIVE                                                 */
  /* ========================================================== */
  @media (max-width: 768px) {
    .inspection-card .card-body {
      padding: 14px 16px;
    }

    .filter-section {
      padding: 14px 16px;
    }

    .filter-section .btn-filter,
    .filter-section .btn-reset {
      width: 100%;
      justify-content: center;
    }

    .table-actions {
      flex-wrap: wrap;
    }

    .btn-action-sm {
      width: 26px;
      height: 26px;
      font-size: 11px;
    }
  }

  @media (max-width: 480px) {
    .inspection-card .card-body {
      padding: 10px 12px;
    }

    .question-card {
      padding: 10px 12px;
    }

    .question-card .question-text {
      font-size: 13px;
    }

    .badge-status {
      font-size: 11px;
      padding: 4px 12px;
    }

    .category-badge {
      font-size: 11px;
      padding: 3px 10px;
    }

    .btn-teal {
      font-size: 13px;
      padding: 6px 14px;
    }
  }
</style>
{% endblock %}
