{% extends 'base/base.html' %}

{% block content %}

<div class="card">

    <div class="card-header bg-danger text-white">
        Delete Session
    </div>

    <div class="card-body">

        <p>
            Are you sure you want to delete
            <strong>{{ session.session_no }}</strong> ?
        </p>

        <form method="post">

            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger">

                Delete

            </button>

            <a href="{% url 'toolbox_talk:session_list' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
