{% extends 'base/base.html' %}

{% block extra_css %}
{{ block.super }}
<style>
    /* ==========================================================
       TEAL THEME (matching Inspection Dashboard)
       ========================================================== */
    :root {
        --primary-teal: #0d9488;
        --primary-teal-dark: #0f766e;
        --primary-teal-light: rgba(13, 148, 136, 0.08);
        --primary-teal-hover: rgba(13, 148, 136, 0.12);
        --primary-teal-medium: rgba(13, 148, 136, 0.15);

        --secondary-red: #dc2626;
        --secondary-red-light: rgba(220, 38, 38, 0.08);
        --secondary-gold: #d97706;
        --secondary-gold-light: rgba(217, 119, 6, 0.08);
        --secondary-green: #22c55e;
        --secondary-green-light: rgba(34, 197, 94, 0.08);
        --secondary-blue: #3b82f6;

        --text-primary: #0f172a;
        --text-secondary: #334155;
        --text-muted: #64748b;
        --text-white: #ffffff;

        --border-color: #e2e8f0;
        --bg-card: #ffffff;
        --bg-page: #f1f5f9;
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06);
        --shadow-hover: 0 4px 20px rgba(13, 148, 136, 0.12);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.10);
        --radius-card: 14px;
        --radius-sm: 8px;
    }

    /* ----- HERO (teal gradient) ----- */
    .audit-hero {
        background: linear-gradient(135deg, var(--primary-teal) 0%, var(--primary-teal-dark) 100%);
        color: var(--text-white);
        border-radius: var(--radius-card);
        padding: 1.35rem 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 18px 42px rgba(13, 148, 136, 0.18);
    }

    .audit-hero h2,
    .audit-hero p {
        color: var(--text-white);
        margin-bottom: 0;
    }

    .audit-hero h2 {
        font-weight: 700;
        font-size: 1.3rem;
    }

    .audit-hero p {
        opacity: 0.9;
        font-size: 0.9rem;
    }

    /* ----- PANEL (teal) ----- */
    .audit-panel {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        transition: box-shadow 0.2s, border-color 0.2s;
    }

    .audit-panel:hover {
        border-color: rgba(13, 148, 136, 0.15);
    }

    .audit-panel .card-header {
        background: var(--bg-page);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 1.2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
    }

    .audit-panel .card-header .card-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .audit-panel .card-header .card-title i {
        color: var(--primary-teal);
    }

    .audit-panel .card-body,
    .audit-panel .card-footer {
        padding: 1.2rem;
    }

    .audit-panel .card-footer {
        background: var(--bg-page);
        border-top: 1px solid var(--border-color);
    }

    /* ----- TABLE (teal) ----- */
    .audit-table {
        width: 100%;
        border-collapse: collapse;
    }

    .audit-table thead th {
        border-top: 0;
        border-bottom: 2px solid var(--border-color);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-muted);
        padding: 0.7rem 0.75rem;
        background: var(--bg-page);
        white-space: nowrap;
    }

    .audit-table tbody td {
        padding: 0.6rem 0.75rem;
        vertical-align: middle;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.88rem;
        color: var(--text-secondary);
    }

    .audit-table tbody tr {
        transition: background 0.15s ease;
    }

    .audit-table tbody tr:hover {
        background: var(--primary-teal-light);
    }

    .audit-table tbody tr:last-child td {
        border-bottom: none;
    }

    .audit-table a {
        color: var(--primary-teal);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
    }

    .audit-table a:hover {
        color: var(--primary-teal-dark);
        text-decoration: underline;
    }

    /* ----- PILLS (teal) ----- */
    .audit-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.25rem 0.85rem;
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: 0.02em;
        white-space: nowrap;
        gap: 4px;
    }

    /* Priority pills */
    .priority-critical {
        background: var(--secondary-red-light);
        color: var(--secondary-red);
    }

    .priority-high {
        background: #fef3c7;
        color: #d97706;
    }

    .priority-medium {
        background: var(--primary-teal-light);
        color: var(--primary-teal);
    }

    .priority-low {
        background: #dbeafe;
        color: #3b82f6;
    }

    /* Risk pills */
    .risk-critical,
    .risk-high {
        background: var(--secondary-red-light);
        color: var(--secondary-red);
    }

    .risk-major {
        background: #fef3c7;
        color: #d97706;
    }

    .risk-medium {
        background: var(--primary-teal-light);
        color: var(--primary-teal);
    }

    .risk-minor {
        background: var(--secondary-green-light);
        color: var(--secondary-green);
    }

    .risk-none {
        background: #f1f5f9;
        color: var(--text-muted);
    }

    /* Status pills */
    .status-draft {
        background: #f1f5f9;
        color: var(--text-muted);
    }

    .status-scheduled,
    .status-open {
        background: #dbeafe;
        color: #3b82f6;
    }

    .status-in_progress,
    .status-fixed {
        background: #fef3c7;
        color: #d97706;
    }

    .status-completed,
    .status-resolved,
    .status-verified,
    .status-closed {
        background: var(--secondary-green-light);
        color: var(--secondary-green);
    }

    .status-cancelled {
        background: var(--secondary-red-light);
        color: var(--secondary-red);
    }

    .status-overdue {
        background: var(--secondary-red-light);
        color: var(--secondary-red);
    }

    /* Review status pills */
    .review-pending {
        background: #fef3c7;
        color: #d97706;
    }

    .review-approved {
        background: var(--secondary-green-light);
        color: var(--secondary-green);
    }

    .review-rejected {
        background: var(--secondary-red-light);
        color: var(--secondary-red);
    }

    .review-not_required {
        background: #f1f5f9;
        color: var(--text-muted);
    }

    /* ----- METRICS (teal) ----- */
    .audit-metric {
        padding: 1rem 1.2rem;
        border-radius: var(--radius-card);
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        box-shadow: var(--shadow-card);
        height: 100%;
        transition: all 0.2s ease;
    }

    .audit-metric:hover {
        box-shadow: var(--shadow-hover);
        border-color: rgba(13, 148, 136, 0.15);
        transform: translateY(-2px);
    }

    .audit-metric-label {
        color: var(--text-muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    .audit-metric-value {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--text-primary);
        margin-top: 0.35rem;
        line-height: 1.2;
    }

    /* ----- FORM (teal) ----- */
    .audit-form-card label {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-secondary);
        display: block;
        margin-bottom: 4px;
    }

    .audit-form-card input,
    .audit-form-card select,
    .audit-form-card textarea {
        width: 100%;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        box-shadow: none;
        padding: 0.5rem 0.7rem;
        font-size: 0.9rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        background: white;
        color: var(--text-primary);
        font-family: inherit;
    }

    .audit-form-card input:focus,
    .audit-form-card select:focus,
    .audit-form-card textarea:focus {
        outline: 0;
        border-color: var(--primary-teal);
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    .audit-form-card textarea {
        min-height: 80px;
        resize: vertical;
    }

    .audit-form-card .help-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 3px;
        display: block;
    }

    /* ----- QUESTION CARD (teal) ----- */
    .audit-question {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-card);
        background: var(--bg-card);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        margin-bottom: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .audit-question:hover {
        border-color: rgba(13, 148, 136, 0.2);
        box-shadow: var(--shadow-hover);
    }

    .audit-question-header {
        padding: 1rem 1.2rem;
        background: var(--bg-page);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 8px;
    }

    .audit-question-header h5 {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0 0 4px 0;
    }

    .audit-question-header .text-muted {
        font-size: 0.82rem;
        color: var(--text-muted);
    }

    .audit-question-body {
        padding: 1.2rem;
    }

    /* ----- PHOTO FRAME (teal) ----- */
    .audit-photo-frame {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: var(--bg-page);
        padding: 0.75rem 1rem;
        transition: border-color 0.2s;
    }

    .audit-photo-frame:hover {
        border-color: rgba(13, 148, 136, 0.25);
    }

    .audit-photo-frame img {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        margin-top: 6px;
    }

    /* ----- BUTTONS (teal) ----- */
    .btn {
        border-radius: var(--radius-sm);
        font-weight: 600;
        padding: 0.5rem 1.2rem;
        font-size: 0.88rem;
        transition: all 0.2s;
        cursor: pointer;
        border: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        font-family: inherit;
    }

    .btn-primary {
        background: var(--primary-teal);
        color: white;
    }

    .btn-primary:hover {
        background: var(--primary-teal-dark);
        box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        transform: translateY(-1px);
        color: white;
        text-decoration: none;
    }

    .btn-secondary {
        background: var(--bg-card);
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
        background: var(--primary-teal-light);
        border-color: var(--primary-teal);
        color: var(--primary-teal);
        text-decoration: none;
    }

    .btn-success {
        background: var(--secondary-green);
        color: white;
    }

    .btn-success:hover {
        background: #16a34a;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        color: white;
        text-decoration: none;
        transform: translateY(-1px);
    }

    .btn-danger {
        background: var(--secondary-red);
        color: white;
    }

    .btn-danger:hover {
        background: #b91c1c;
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        color: white;
        text-decoration: none;
        transform: translateY(-1px);
    }

    .btn-warning {
        background: var(--secondary-gold);
        color: white;
    }

    .btn-warning:hover {
        background: #b45309;
        box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        color: white;
        text-decoration: none;
        transform: translateY(-1px);
    }

    .btn-outline-primary {
        background: transparent;
        border: 1px solid var(--primary-teal);
        color: var(--primary-teal);
    }

    .btn-outline-primary:hover {
        background: var(--primary-teal);
        color: white;
        text-decoration: none;
    }

    .btn-outline-danger {
        background: transparent;
        border: 1px solid var(--secondary-red);
        color: var(--secondary-red);
    }

    .btn-outline-danger:hover {
        background: var(--secondary-red);
        color: white;
        text-decoration: none;
    }

    .btn-sm {
        font-size: 0.78rem;
        padding: 0.3rem 0.7rem;
    }

    .btn-block {
        display: block;
        width: 100%;
    }

    /* ----- CHECKBOX (teal) ----- */
    .form-check {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
    }

    .form-check:hover {
        border-color: rgba(13, 148, 136, 0.25);
        background: var(--primary-teal-light);
    }

    .form-check input[type="checkbox"] {
        width: 17px;
        height: 17px;
        cursor: pointer;
        accent-color: var(--primary-teal);
        border-radius: 4px;
        border: 2px solid var(--border-color);
        transition: all 0.2s;
        flex-shrink: 0;
        margin: 0;
    }

    .form-check input[type="checkbox"]:checked {
        background-color: var(--primary-teal);
        border-color: var(--primary-teal);
    }

    .form-check-label {
        margin: 0;
        font-weight: 500;
        font-size: 0.88rem;
        color: var(--text-secondary);
        cursor: pointer;
    }

    /* ----- PAGINATION (teal) ----- */
    .pagination {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
        margin: 0;
        justify-content: flex-end;
    }

    .pagination .page-item .page-link {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-weight: 500;
        padding: 0.35rem 0.75rem;
        font-size: 0.82rem;
        transition: all 0.2s;
        background: var(--bg-card);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .pagination .page-item .page-link:hover {
        background: var(--primary-teal-light);
        border-color: var(--primary-teal);
        color: var(--primary-teal);
    }

    .pagination .page-item.active .page-link {
        background: var(--primary-teal);
        border-color: var(--primary-teal);
        color: white;
    }

    .pagination .page-item.disabled .page-link {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
    }

    /* ----- SELECT ALL BAR (teal) ----- */
    .select-all-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        padding: 8px 14px;
        background: var(--bg-page);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        flex-wrap: wrap;
    }

    .select-all-bar .btn-sm {
        font-size: 0.75rem;
        padding: 0.25rem 0.7rem;
        border-radius: var(--radius-sm);
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-secondary);
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .select-all-bar .btn-sm:hover {
        background: var(--primary-teal-light);
        border-color: var(--primary-teal);
        color: var(--primary-teal);
    }

    /* ----- CHECKBOX GRID (teal) ----- */
    .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 8px;
        max-height: 320px;
        overflow-y: auto;
        border: 1px solid var(--border-color);
        padding: 14px;
        border-radius: var(--radius-sm);
        background: var(--bg-card);
    }

    .checkbox-grid::-webkit-scrollbar {
        width: 6px;
    }

    .checkbox-grid::-webkit-scrollbar-track {
        background: var(--bg-page);
        border-radius: 3px;
    }

    .checkbox-grid::-webkit-scrollbar-thumb {
        background: var(--primary-teal);
        border-radius: 3px;
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        background: var(--bg-card);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .checkbox-item:hover {
        background: var(--primary-teal-light);
        border-color: var(--primary-teal);
    }

    .checkbox-item input[type="checkbox"] {
        margin-right: 10px;
        width: 17px;
        height: 17px;
        cursor: pointer;
        accent-color: var(--primary-teal);
        flex-shrink: 0;
    }

    .checkbox-item label {
        margin: 0;
        cursor: pointer;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .checkbox-item label strong {
        color: var(--text-primary);
    }

    .group-header {
        grid-column: 1 / -1;
        background: var(--primary-teal-light);
        padding: 6px 12px;
        font-weight: 600;
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
        color: var(--primary-teal);
        border-left: 3px solid var(--primary-teal);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 767.98px) {
        .audit-hero,
        .audit-panel .card-header,
        .audit-panel .card-body,
        .audit-panel .card-footer,
        .audit-question-header,
        .audit-question-body {
            padding: 1rem;
        }

        .audit-hero h2 {
            font-size: 1.1rem;
        }

        .audit-metric-value {
            font-size: 1.4rem;
        }

        .checkbox-grid {
            grid-template-columns: 1fr;
            max-height: 250px;
            padding: 10px;
        }

        .audit-table thead th,
        .audit-table tbody td {
            padding: 0.5rem 0.4rem;
            font-size: 0.8rem;
        }

        .pagination {
            justify-content: center;
        }
    }

    @media (max-width: 480px) {
        .audit-hero {
            padding: 0.8rem;
        }

        .audit-hero h2 {
            font-size: 1rem;
        }

        .audit-pill {
            font-size: 0.65rem;
            padding: 0.2rem 0.6rem;
        }

        .btn {
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
        }

        .audit-metric-value {
            font-size: 1.2rem;
        }
    }

    /* utility */
    .text-center {
        text-align: center !important;
    }
    .text-right {
        text-align: right !important;
    }
    .text-muted {
        color: var(--text-muted) !important;
    }
    .text-danger {
        color: var(--secondary-red) !important;
    }
    .text-success {
        color: var(--secondary-green) !important;
    }
    .mb-0 {
        margin-bottom: 0 !important;
    }
    .mb-2 {
        margin-bottom: 8px !important;
    }
    .mb-3 {
        margin-bottom: 16px !important;
    }
    .mb-4 {
        margin-bottom: 24px !important;
    }
    .mt-2 {
        margin-top: 8px !important;
    }
    .mt-3 {
        margin-top: 16px !important;
    }
    .mt-4 {
        margin-top: 24px !important;
    }
    .d-flex {
        display: flex !important;
    }
    .justify-content-between {
        justify-content: space-between !important;
    }
    .align-items-center {
        align-items: center !important;
    }
    .flex-wrap {
        flex-wrap: wrap !important;
    }
    .gap-2 {
        gap: 8px !important;
    }
    .gap-3 {
        gap: 16px !important;
    }
    .row {
        display: flex;
        flex-wrap: wrap;
        margin: 0 -12px;
    }
    .col-lg-4 {
        flex: 0 0 33.333%;
        max-width: 33.333%;
        padding: 0 12px;
    }
    .col-lg-8 {
        flex: 0 0 66.667%;
        max-width: 66.667%;
        padding: 0 12px;
    }
    .col-md-6 {
        flex: 0 0 50%;
        max-width: 50%;
        padding: 0 12px;
    }
    .col-md-4 {
        flex: 0 0 33.333%;
        max-width: 33.333%;
        padding: 0 12px;
    }
    .col-12 {
        flex: 0 0 100%;
        max-width: 100%;
        padding: 0 12px;
    }

    @media (max-width: 768px) {
        .col-lg-4,
        .col-lg-8,
        .col-md-6,
        .col-md-4 {
            flex: 0 0 100%;
            max-width: 100%;
        }
    }
</style>
{% endblock %}
