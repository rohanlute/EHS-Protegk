{% for insight in insights %}<div class="report-list-row"><span class="priority-chip priority-{{ insight.priority|lower }}">{{ insight.priority }}</span><div><strong>{{ insight.title }}</strong><div class="small">{{ insight.reason }}</div><div class="text-muted small">{{ insight.recommendation }} · {{ insight.get_status_display }}</div></div></div>{% empty %}<p class="text-muted mb-0">No open opportunities.</p>{% endfor %}
