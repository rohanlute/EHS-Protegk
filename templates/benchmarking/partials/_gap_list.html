{% for gap in gaps %}<div class="report-list-row"><span class="priority-chip priority-{{ gap.priority|lower }}">{{ gap.priority }}</span><div><strong>{{ gap.kpi.name|default:"Benchmark gap" }}</strong><div class="text-muted small">Actual {{ gap.actual_value }} · Target {{ gap.reference_value }} · Gap {{ gap.gap_value }}</div><div class="small">{{ gap.reason }}</div></div></div>{% empty %}<p class="text-muted mb-0">No gaps recorded for this period.</p>{% endfor %}
