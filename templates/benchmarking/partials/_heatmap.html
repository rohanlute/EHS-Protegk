<div class="table-responsive"><table class="table table-sm benchmark-table"><thead><tr><th>Plant</th>{% for category in categories %}<th>{{ category }}</th>{% endfor %}</tr></thead><tbody>{% for plant, cells in heatmap.items %}<tr><td><strong>{{ plant }}</strong></td>{% for code, cell in cells.items %}<td title="{{ cell.level_name }}">{% if cell.score is not None %}{{ cell.score|floatformat:1 }}%<small class="d-block text-muted">{{ cell.level_name }}</small>{% else %}—{% endif %}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div>
