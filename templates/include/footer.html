<!-- Main Footer -->
<style>
  .main-footer {
    background: rgba(255, 255, 255, 0.95) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(16, 185, 129, 0.12);
    color: #1a1a1a !important;
    padding: 16px 24px;
    font-size: 14px;
    box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.04);
  }

  .main-footer a {
    color: #0d9488 !important;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .main-footer a:hover {
    color: #0f766e !important;
    text-decoration: underline;
  }

  .main-footer .footer-brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .main-footer .footer-brand .brand-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0d9488, #0f766e);
    margin-right: 4px;
    animation: pulse-dot-footer 2s ease-in-out infinite;
  }

  @keyframes pulse-dot-footer {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  .main-footer .footer-divider {
    color: rgba(0, 0, 0, 0.10);
    margin: 0 8px;
  }

  .main-footer .footer-text-muted {
    color: #6b7280;
  }

  .main-footer .float-right {
    color: #6b7280;
    font-size: 13px;
  }

  .main-footer .float-right .version-badge {
    background: rgba(13, 148, 136, 0.08);
    padding: 2px 14px;
    border-radius: 20px;
    font-weight: 600;
    color: #0d9488;
    font-size: 12px;
    border: 1px solid rgba(13, 148, 136, 0.10);
  }

  .main-footer .float-right .version-badge i {
    margin-right: 4px;
    font-size: 11px;
  }

  /* Dark theme footer */
  body.dark-theme .main-footer {
    background: rgba(10, 15, 13, 0.92) !important;
    border-top: 1px solid rgba(13, 148, 136, 0.10);
    color: rgba(215, 245, 229, 0.8) !important;
  }

  body.dark-theme .main-footer a {
    color: #2dd4bf !important;
  }

  body.dark-theme .main-footer a:hover {
    color: #5eead4 !important;
  }

  body.dark-theme .main-footer .footer-divider {
    color: rgba(215, 245, 229, 0.10);
  }

  body.dark-theme .main-footer .footer-text-muted {
    color: rgba(215, 245, 229, 0.4);
  }

  body.dark-theme .main-footer .float-right {
    color: rgba(215, 245, 229, 0.4);
  }

  body.dark-theme .main-footer .float-right .version-badge {
    background: rgba(13, 148, 136, 0.08);
    color: #2dd4bf;
    border-color: rgba(13, 148, 136, 0.10);
  }

  body.dark-theme .main-footer .footer-brand .brand-dot {
    background: linear-gradient(135deg, #2dd4bf, #14b8a6);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .main-footer {
      padding: 14px 16px;
      font-size: 13px;
      text-align: center;
    }
    
    .main-footer .float-right {
      display: block !important;
      float: none !important;
      margin-top: 6px;
      font-size: 12px;
    }
    
    .main-footer .footer-divider {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .main-footer {
      padding: 12px 14px;
      font-size: 12px;
    }
    
    .main-footer .float-right {
      font-size: 11px;
    }
    
    .main-footer .footer-brand .brand-dot {
      width: 6px;
      height: 6px;
    }
  }
</style>

<footer class="main-footer">
  <div class="footer-brand">
    <span class="brand-dot"></span>
    <strong>
      &copy; <span id="currentYear"></span>
      <a href="https://protegk.com" target="_blank">PROTEGK IT Solutions</a>
    </strong>
    <span class="footer-divider">|</span>
    <span class="footer-text-muted">All rights reserved.</span>
  </div>
  
  <div class="float-right d-none d-sm-inline-block">
    <span class="version-badge">
      <i class="fas fa-code-branch"></i> v2.0.0
    </span>
    <span style="margin: 0 6px; color: rgba(0,0,0,0.08);">|</span>
    <span style="font-weight: 500; color: #374151;">EHS-360</span>
  </div>
</footer>

<script>
  // Set current year dynamically
  document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>
