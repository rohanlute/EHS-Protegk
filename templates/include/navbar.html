{% load static %}
<style>
/* ==================== NAVBAR - MODERN TEAL THEME ==================== */
.navbar-esg {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(13, 148, 136, 0.15);
  box-shadow: 0 2px 20px rgba(13, 148, 136, 0.06);
  padding: 0.5rem 1.2rem;
  transition: all 0.3s ease;
}

/* ==================== LEFT TOGGLE ==================== */
.navbar-esg .nav-link {
  color: #0f766e !important;
  padding: 0 !important;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.navbar-esg .nav-link:hover {
  color: #0d9488 !important;
}

/* Pushmenu button with right arrow */
.pushmenu-toggle {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(13, 148, 136, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  border: 1px solid rgba(13, 148, 136, 0.08);
  text-decoration: none;
  position: relative;
}

.pushmenu-toggle i {
  font-size: 20px;
  color: #0f766e;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.pushmenu-toggle:hover {
  background: rgba(13, 148, 136, 0.12);
  border-color: rgba(13, 148, 136, 0.25);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(13, 148, 136, 0.12);
}

.pushmenu-toggle:hover i {
  color: #0d9488;
}

.pushmenu-toggle:active {
  transform: scale(0.92);
}

/* Arrow rotation based on sidebar state */
body:not(.sidebar-collapse) .pushmenu-toggle i {
  transform: rotate(180deg);
  color: #0d9488;
}

body.sidebar-collapse .pushmenu-toggle i {
  transform: rotate(0deg);
  color: #0f766e;
}

/* ==================== RIGHT ICON GROUP ==================== */
.right-icon-group {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

/* ==================== ICON BUTTONS ==================== */
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(13, 148, 136, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  cursor: pointer;
  color: #0f766e;
  border: 1px solid rgba(13, 148, 136, 0.08);
  text-decoration: none;
  position: relative;
}

.icon-btn i {
  font-size: 16px;
  transition: all 0.3s ease;
}

.icon-btn:hover {
  background: rgba(13, 148, 136, 0.12);
  border-color: rgba(13, 148, 136, 0.25);
  transform: translateY(-2px);
  color: #0d9488;
  box-shadow: 0 4px 20px rgba(13, 148, 136, 0.12);
}

.icon-btn:active {
  transform: scale(0.92);
}

/* ==================== NOTIFICATION BADGE ==================== */
.icon-btn .notif-dot {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ef4444;
  border: 2px solid #ffffff;
  animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}

/* ==================== DROPDOWN MENU ==================== */
.custom-dropdown-menu {
  min-width: 240px;
  border-radius: 14px;
  border: 1px solid rgba(13, 148, 136, 0.10);
  padding: 8px 0;
  margin-top: 12px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
  animation: fadeInDropdown 0.25s ease-out;
  right: 0;
  left: auto;
  background: #ffffff;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

@keyframes fadeInDropdown {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ==================== USER DROPDOWN ==================== */
.dropdown-header-profile {
  padding: 16px 20px 20px 20px;
  text-align: center;
  border-bottom: 1px solid rgba(13, 148, 136, 0.08);
  margin-bottom: 6px;
}

.dropdown-header-profile .avatar-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0d9488, #0f766e);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px auto;
  font-size: 20px;
  font-weight: 700;
  color: #ffffff;
  box-shadow: 0 4px 16px rgba(13, 148, 136, 0.20);
}

.dropdown-header-profile strong {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #1a1a1a;
}

.dropdown-header-profile small {
  display: block;
  font-size: 12px;
  color: #6b7280;
}

.dropdown-item-custom {
  font-size: 13px;
  padding: 9px 20px;
  color: #374151;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 12px;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  cursor: pointer;
  text-decoration: none;
}

.dropdown-item-custom:hover {
  background: rgba(13, 148, 136, 0.06);
  text-decoration: none;
  color: #0d9488;
}

.dropdown-item-custom i {
  width: 18px;
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
}

.dropdown-item-custom:hover i {
  color: #0d9488;
}

.dropdown-divider {
  border-top: 1px solid rgba(13, 148, 136, 0.08);
  margin: 4px 12px;
}

/* ==================== NOTIFICATIONS ==================== */
.notif-header {
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 600;
  color: #1a1a1a;
  border-bottom: 1px solid rgba(13, 148, 136, 0.08);
}

.notif-empty-state {
  padding: 28px 20px;
  text-align: center;
  color: #9ca3af;
}

.notif-empty-state i {
  font-size: 32px;
  color: #e5e7eb;
  display: block;
  margin-bottom: 10px;
}

.notif-empty-state p {
  font-size: 13px;
  margin: 0;
}

/* ==================== SIDEBAR TRANSITION - SMOOTH ==================== */
.main-sidebar {
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

.content-wrapper,
.main-header,
.main-footer {
  transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* ==================== RESPONSIVE ==================== */
@media (max-width: 768px) {
  .navbar-esg {
    padding: 0.5rem 0.8rem;
  }
  
  .icon-btn {
    width: 34px;
    height: 34px;
  }
  
  .icon-btn i {
    font-size: 14px;
  }
  
  .right-icon-group {
    gap: 4px;
  }
  
  .pushmenu-toggle {
    width: 36px;
    height: 36px;
  }
  
  .pushmenu-toggle i {
    font-size: 17px;
  }
}

@media (max-width: 480px) {
  .icon-btn {
    width: 30px;
    height: 30px;
  }
  
  .icon-btn i {
    font-size: 12px;
  }
  
  .right-icon-group {
    gap: 2px;
  }
  
  .pushmenu-toggle {
    width: 32px;
    height: 32px;
  }
  
  .pushmenu-toggle i {
    font-size: 15px;
  }
}
</style>

<!-- ==================== NAVBAR HTML ==================== -->
<nav class="main-header navbar navbar-expand navbar-esg">
  
  <!-- LEFT: Sidebar Toggle - Right Arrow -->
  <ul class="navbar-nav align-items-center">
    <li class="nav-item">
      <a class="nav-link pushmenu-toggle" data-widget="pushmenu" href="#" role="button" id="sidebarToggle">
        <i class="fas fa-arrow-right"></i>
      </a>
    </li>
  </ul>

  <!-- RIGHT: Three Icons -->
  <div class="right-icon-group">
    
    <!-- 1. Fullscreen Toggle -->
    <a href="#" id="fullscreenToggle" class="icon-btn" title="Toggle Fullscreen">
      <i class="bi bi-fullscreen"></i>
    </a>

    <!-- 2. Notification Bell -->
    <div class="dropdown" style="position: relative;">
      <a href="#" class="icon-btn" id="notifDropdownToggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <i class="bi bi-bell"></i>
        <span class="notif-dot"></span>
      </a>
      
      <div class="dropdown-menu custom-dropdown-menu dropdown-menu-right" aria-labelledby="notifDropdownToggle">
        <div class="notif-header">Notifications</div>
        <div class="notif-empty-state">
          <i class="bi bi-bell-slash"></i>
          <p>No notifications yet</p>
        </div>
      </div>
    </div>

    <!-- 3. User Dropdown -->
    <div class="dropdown" style="position: relative;">
      <a href="#" class="icon-btn" id="userDropdownToggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-user"></i>
      </a>
      
      <div class="dropdown-menu custom-dropdown-menu dropdown-menu-right" aria-labelledby="userDropdownToggle">
        <div class="dropdown-header-profile">
          <div class="avatar-circle">{{ request.user.get_full_name|default:request.user.username|slice:":1"|upper }}</div>
          <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
          <small>{{ request.user.role.name|default:"Admin" }}</small>
        </div>
        
        <a href="{% url 'accounts:user_detail' request.user.pk %}" class="dropdown-item-custom">
          <i class="fas fa-user"></i> My Profile
        </a>
        <div class="dropdown-divider"></div>
        <a href="{% url 'accounts:logout' %}" class="dropdown-item-custom">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </div>

  </div>
</nav>

<!-- ==================== SCRIPTS ==================== -->
<script>
  document.getElementById('fullscreenToggle').addEventListener('click', function(e) {
    e.preventDefault();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {});
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  });

  // ===== SIMPLE SIDEBAR TOGGLE WITH CSS ARROW =====
  $(document).ready(function() {
    // Toggle sidebar on click
    $('#sidebarToggle').on('click', function(e) {
      e.preventDefault();
      
      var $body = $('body');
      
      // Toggle sidebar class - this will trigger CSS arrow rotation
      if ($body.hasClass('sidebar-collapse')) {
        $body.removeClass('sidebar-collapse');
        $body.addClass('sidebar-open');
        $('.main-sidebar').css('transform', 'translateX(0)');
        $('.content-wrapper, .main-header, .main-footer').css('margin-left', '270px');
      } else {
        $body.addClass('sidebar-collapse');
        $body.removeClass('sidebar-open');
        $('.main-sidebar').css('transform', 'translateX(-100%)');
        $('.content-wrapper, .main-header, .main-footer').css('margin-left', '0');
      }
    });

    // Initialize sidebar state
    var $body = $('body');
    if ($(window).width() <= 768) {
      $body.addClass('sidebar-collapse');
      $('.main-sidebar').css('transform', 'translateX(-100%)');
      $('.content-wrapper, .main-header, .main-footer').css('margin-left', '0');
    } else {
      if (!$body.hasClass('sidebar-collapse')) {
        $body.addClass('sidebar-open');
        $('.main-sidebar').css('transform', 'translateX(0)');
        $('.content-wrapper, .main-header, .main-footer').css('margin-left', '270px');
      }
    }

    // Handle window resize
    $(window).on('resize', function() {
      if ($(window).width() > 768) {
        if (!$body.hasClass('sidebar-collapse')) {
          $('.main-sidebar').css('transform', 'translateX(0)');
          $('.content-wrapper, .main-header, .main-footer').css('margin-left', '270px');
        } else {
          $('.main-sidebar').css('transform', 'translateX(-100%)');
          $('.content-wrapper, .main-header, .main-footer').css('margin-left', '0');
        }
      } else {
        if (!$body.hasClass('sidebar-open')) {
          $('.main-sidebar').css('transform', 'translateX(-100%)');
          $('.content-wrapper, .main-header, .main-footer').css('margin-left', '0');
        }
      }
    });
  });
</script>
