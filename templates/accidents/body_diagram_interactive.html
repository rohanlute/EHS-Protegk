<!-- Interactive Body Diagram Component - Teal Theme -->

<style>
/* Interactive Body Diagram Styles - Teal Theme */
.body-diagram-card {
    background: white;
    border-radius: var(--radius-card, 12px);
    padding: 20px;
    margin-top: 20px;
    border: 1px solid var(--border-color, #e2e8f0);
    box-shadow: var(--shadow-card, 0 1px 3px rgba(0, 0, 0, 0.06));
    transition: all 0.3s ease;
}

.body-diagram-card:hover {
    box-shadow: var(--shadow-hover, 0 4px 20px rgba(13, 148, 136, 0.12));
}

.body-diagram-card h5 {
    color: var(--text-primary, #0f172a);
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.body-diagram-card h5 i {
    color: var(--primary-teal, #0d9488);
}

.body-diagram-card .text-muted {
    color: var(--text-muted, #64748b) !important;
    font-size: 14px;
    margin-bottom: 16px;
}

.body-diagram-card .text-danger {
    color: var(--secondary-red, #dc2626) !important;
}

.view-selector {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.view-btn-body {
    padding: 8px 18px;
    border: 2px solid var(--border-color, #e2e8f0);
    background: white;
    border-radius: var(--radius-sm, 8px);
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    color: var(--text-secondary, #334155);
}

.view-btn-body:hover {
    border-color: var(--primary-teal, #0d9488);
    color: var(--primary-teal, #0d9488);
    background: var(--primary-teal-light, rgba(13, 148, 136, 0.08));
}

.view-btn-body.active {
    background: var(--primary-teal, #0d9488);
    color: white;
    border-color: var(--primary-teal, #0d9488);
}

.view-btn-body i {
    margin-right: 6px;
}

.diagram-wrapper {
    position: relative;
    width: 100%;
    max-width: 350px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: var(--radius-sm, 8px);
    padding: 15px;
    box-shadow: var(--shadow-card, 0 1px 3px rgba(0, 0, 0, 0.06));
    border: 2px solid var(--border-color, #e2e8f0);
}

.body-part {
    cursor: pointer;
    transition: all 0.25s ease;
    fill: #f8fafc;
    stroke: #cbd5e1;
    stroke-width: 1.5;
}

.body-part:hover {
    fill: var(--primary-teal-light, rgba(13, 148, 136, 0.08));
    stroke: var(--primary-teal, #0d9488);
    opacity: 0.9;
    stroke-width: 2;
}

.body-part.selected {
    fill: #d1fae5 !important;
    stroke: var(--primary-teal, #0d9488);
    stroke-width: 2.5;
}

.body-part.detailed {
    stroke-width: 1;
}

.body-part.detailed:hover {
    stroke-width: 1.5;
}

.part-label {
    font-size: 9px;
    fill: var(--text-muted, #64748b);
    pointer-events: none;
    user-select: none;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
}

/* ===== SELECTED PARTS SUMMARY ===== */
.selected-parts-summary {
    margin-top: 15px;
    padding: 15px 18px;
    background: var(--primary-teal-light, rgba(13, 148, 136, 0.08));
    border-radius: var(--radius-sm, 8px);
    border-left: 4px solid var(--primary-teal, #0d9488);
}

.selected-parts-summary strong {
    color: var(--text-primary, #0f172a);
    font-size: 14px;
}

.selected-parts-summary strong i {
    color: var(--primary-teal, #0d9488);
}

.selected-parts-summary #selectedCount {
    color: var(--primary-teal, #0d9488);
    font-weight: 700;
}

.selected-item-badge {
    display: inline-block;
    background: var(--primary-teal, #0d9488);
    color: white;
    padding: 4px 14px;
    margin: 3px 4px 3px 0;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
}

.selected-item-badge::before {
    content: '✓ ';
    font-weight: 700;
}

.clear-selection-btn {
    background: var(--secondary-red, #dc2626);
    color: white;
    border: none;
    padding: 6px 16px;
    border-radius: var(--radius-sm, 8px);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.clear-selection-btn:hover {
    background: #b91c1c;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
}

.clear-selection-btn i {
    font-size: 14px;
}

/* ===== VIEW SPECIFIC STYLES ===== */
#handsView .body-part,
#feetView .body-part {
    fill: #f1f5f9;
}

#handsView .body-part:hover,
#feetView .body-part:hover {
    fill: var(--primary-teal-light, rgba(13, 148, 136, 0.08));
}

#handsView .body-part.selected,
#feetView .body-part.selected {
    fill: #d1fae5 !important;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .body-diagram-card {
        padding: 14px;
    }

    .view-selector {
        gap: 6px;
    }

    .view-btn-body {
        padding: 6px 12px;
        font-size: 12px;
    }

    .diagram-wrapper {
        max-width: 100%;
        padding: 10px;
    }

    .selected-parts-summary {
        padding: 12px 14px;
    }

    .selected-item-badge {
        font-size: 12px;
        padding: 3px 10px;
    }

    .clear-selection-btn {
        font-size: 12px;
        padding: 5px 12px;
    }
}

@media (max-width: 480px) {
    .body-diagram-card {
        padding: 10px;
    }

    .view-btn-body {
        padding: 5px 10px;
        font-size: 11px;
    }

    .view-btn-body i {
        margin-right: 3px;
    }

    .diagram-wrapper {
        padding: 8px;
    }

    .part-label {
        font-size: 8px;
    }

    .selected-parts-summary {
        padding: 10px 12px;
    }

    .selected-parts-summary strong {
        font-size: 13px;
    }

    .selected-item-badge {
        font-size: 11px;
        padding: 2px 8px;
        margin: 2px 3px 2px 0;
    }

    .clear-selection-btn {
        font-size: 11px;
        padding: 4px 10px;
    }
}
</style>

<script>
(function() {
    // Initialize selectedBodyParts - check if it already exists (from edit page initialization)
    if (!window.selectedBodyParts) {
        window.selectedBodyParts = new Set();
    }

    // === INITIALIZE FROM EXISTING DATA (FOR EDIT MODE) ===
    function initializeExistingBodyParts() {
        // If selectedBodyParts already has data (set from edit page), mark those parts as selected
        if (window.selectedBodyParts && window.selectedBodyParts.size > 0) {
            console.log('Initializing body parts from existing data:', Array.from(window.selectedBodyParts));
            
            window.selectedBodyParts.forEach(partName => {
                // Find all elements with this part name across all views and mark them as selected
                const allSameParts = document.querySelectorAll(`[data-part="${partName}"]`);
                allSameParts.forEach(p => {
                    p.classList.add('selected');
                    console.log('Marked as selected:', partName);
                });
            });
            
            updateBodyPartsList();
        } else {
            console.log('No existing body parts data to initialize');
        }
    }

    // === BODY DIAGRAM INTERACTION ===
    // View switching
    document.querySelectorAll('.view-btn-body').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.view-btn-body').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            const view = this.dataset.view;
            document.querySelectorAll('svg[id$="View"]').forEach(svg => svg.style.display = 'none');
            
            const viewMap = {
                'front': 'frontView',
                'back': 'backView',
                'hands': 'handsView',
                'feet': 'feetView'
            };
            document.getElementById(viewMap[view]).style.display = 'block';
        });
    });
    
    // Body part selection
    document.querySelectorAll('.body-part').forEach(part => {
        part.addEventListener('click', function() {
            const partName = this.dataset.part;
            
            // Find all parts with the same name across all views
            const allSameParts = document.querySelectorAll(`[data-part="${partName}"]`);
            
            if (window.selectedBodyParts.has(partName)) {
                window.selectedBodyParts.delete(partName);
                allSameParts.forEach(p => p.classList.remove('selected'));
            } else {
                window.selectedBodyParts.add(partName);
                allSameParts.forEach(p => p.classList.add('selected'));
            }
            
            updateBodyPartsList();
        });
    });
    
    // Make clearAllBodyParts globally accessible
    window.clearAllBodyParts = function() {
        window.selectedBodyParts.clear();
        document.querySelectorAll('.body-part').forEach(part => {
            part.classList.remove('selected');
        });
        updateBodyPartsList();
    };
    
    function updateBodyPartsList() {
        const listDiv = document.getElementById('selectedPartsList');
        const countSpan = document.getElementById('selectedCount');
        
        countSpan.textContent = window.selectedBodyParts.size;
        
        if (window.selectedBodyParts.size === 0) {
            listDiv.innerHTML = '<p style="color: var(--text-muted, #64748b); font-size: 13px; margin: 5px 0;"><i class="fas fa-info-circle"></i> No body parts selected</p>';
        } else {
            listDiv.innerHTML = '';
            // Sort parts alphabetically for better display
            const sortedParts = Array.from(window.selectedBodyParts).sort();
            sortedParts.forEach(part => {
                const span = document.createElement('span');
                span.className = 'selected-item-badge';
                span.textContent = part;
                listDiv.appendChild(span);
            });
        }
    }

    // Initialize with existing data (if any) - wait a bit for DOM to be fully ready
    setTimeout(function() {
        initializeExistingBodyParts();
        updateBodyPartsList();
    }, 100);
})();
</script>
